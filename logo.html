  <h1>Logó</h1>
  <p class="lead">Összehasonlítás: a jelenlegi logó és a módosított változat — kisebb maszk, két ívből álló felső él, amely középen enyhén az M belső formáját követi.</p>

      <svg class="big" viewBox="0 0 200 200" role="img" aria-label="Jelenlegi logó"><use href="#morpheus-logo"/></svg>
      <div class="row"><svg width="56" height="56" aria-hidden="true"><use href="#morpheus-logo"/></svg><svg width="32" height="32" aria-hidden="true"><use href="#morpheus-logo"/></svg><svg width="16" height="16" aria-hidden="true"><use href="#morpheus-logo"/></svg><span>fejléc · 32 · 16 px</span></div>
