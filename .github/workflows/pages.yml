# Builds the site as a static export and publishes it to GitHub Pages.
#
# Static hosting has no server-side revalidation, so the site is also rebuilt every night just after
# midnight in Budapest: shows, course starts, sessions and workshops dated in the past drop off.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 23 * * *' # 00:15 CET / 01:15 CEST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a running one (it may be mid-publish).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Gives the base path the site is served from: /<repo> on github.io, empty on a custom domain.
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: '1'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
